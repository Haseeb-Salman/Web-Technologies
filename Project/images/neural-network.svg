<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="Diagram of a deep neural network with input, hidden and output layers">
  <defs>
    <linearGradient id="ns" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="560" height="320" rx="20" fill="#0a1120"/>

  <!-- connections -->
  <g stroke="rgba(148,163,184,.22)" stroke-width="1.2" fill="none">
    <path d="M60,90 L200,70 M60,90 L200,130 M60,90 L200,190 M60,90 L200,250
             M60,160 L200,70 M60,160 L200,130 M60,160 L200,190 M60,160 L200,250
             M60,230 L200,70 M60,230 L200,130 M60,230 L200,190 M60,230 L200,250"/>
    <path d="M200,70 L340,90 M200,70 L340,170 M200,130 L340,90 M200,130 L340,170
             M200,190 L340,90 M200,190 L340,170 M200,250 L340,170
             M340,90 L480,120 M340,90 L480,210 M340,170 L480,120 M340,170 L480,210"/>
  </g>

  <!-- highlighted signal paths with travelling pulse -->
  <g fill="none" stroke="url(#ns)" stroke-width="2.4" stroke-linecap="round"
     stroke-dasharray="10 14">
    <path d="M60,160 L200,130 L340,170 L480,120">
      <animate attributeName="stroke-dashoffset" values="48;0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M60,90 L200,190 L340,90 L480,210" opacity=".7">
      <animate attributeName="stroke-dashoffset" values="0;48" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- input layer -->
  <g fill="#0b1226" stroke="#22d3ee" stroke-width="2.5">
    <circle cx="60" cy="90" r="12"/>
    <circle cx="60" cy="160" r="12"/>
    <circle cx="60" cy="230" r="12"/>
  </g>
  <!-- hidden layer 1 -->
  <g fill="#0b1226" stroke="#38bdf8" stroke-width="2.5">
    <circle cx="200" cy="70" r="12"/>
    <circle cx="200" cy="130" r="12"/>
    <circle cx="200" cy="190" r="12"/>
    <circle cx="200" cy="250" r="12"/>
  </g>
  <!-- hidden layer 2 -->
  <g fill="#0b1226" stroke="#818cf8" stroke-width="2.5">
    <circle cx="340" cy="90" r="12"/>
    <circle cx="340" cy="170" r="12"/>
  </g>
  <!-- output layer -->
  <g fill="#a78bfa" stroke="#c4b5fd" stroke-width="2.5">
    <circle cx="480" cy="120" r="14">
      <animate attributeName="r" values="14;17;14" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="210" r="14">
      <animate attributeName="r" values="14;17;14" dur="2s" begin=".6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- labels -->
  <g fill="#a3b2c9" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="60" y="285">Input</text>
    <text x="200" y="285">Hidden 1</text>
    <text x="340" y="285">Hidden 2</text>
    <text x="480" y="285">Output</text>
  </g>
</svg>
