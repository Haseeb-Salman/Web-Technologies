<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-label="Balance scales representing fairness and ethics in AI">
  <defs>
    <linearGradient id="sc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="360" height="320" rx="20" fill="#0a1120"/>

  <!-- stand -->
  <rect x="168" y="70" width="10" height="180" rx="5" fill="url(#sc)"/>
  <rect x="120" y="250" width="106" height="12" rx="6" fill="url(#sc)"/>
  <circle cx="173" cy="62" r="12" fill="#a78bfa"/>

  <!-- beam (gently rocking) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-5 173 84; 5 173 84; -5 173 84" dur="5s" repeatCount="indefinite"/>
    <rect x="58" y="79" width="230" height="9" rx="4.5" fill="#94a3b8"/>
    <!-- pans -->
    <g fill="none" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round">
      <path d="M78 88 L58 138 M78 88 L98 138"/>
      <path d="M58,138 a22,22 0 0 0 40,0 Z" fill="rgba(34,211,238,.18)"/>
      <path d="M268 88 L248 138 M268 88 L288 138"/>
      <path d="M248,138 a22,22 0 0 0 40,0 Z" fill="rgba(167,139,250,.18)"/>
    </g>
  </g>

  <!-- labels -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#a3b2c9">
    <text x="78" y="190">Innovation</text>
    <text x="268" y="190">Responsibility</text>
  </g>
</svg>
