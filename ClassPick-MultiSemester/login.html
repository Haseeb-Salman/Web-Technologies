<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassPick | Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">
    <div class="ambient ambient-one"></div>
    <div class="login-card"><a class="brand login-brand"><span class="brand-mark">CP</span><span>Class<span
                    class="accent">Pick</span><small>ADMIN ACCESS</small></span></a>
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Admin <span class="accent">Login</span></h1>
        <p class="muted">Sign in to manage your BS-IT classes.</p>
        <form id="loginForm"><label for="email">Email address</label><input id="email" type="email"
                autocomplete="username" placeholder="admin@example.com" required><label
                for="password">Password</label><input id="password" type="password" autocomplete="current-password"
                placeholder="Enter password" required><button class="btn btn-primary full" id="loginButton"
                type="submit">Sign in →</button></form>
        <p id="loginMessage" class="status" role="status"></p>
    </div>
    <script type="module" src="login.js"></script>
</body>

</html>
