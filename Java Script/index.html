<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="quiz-container">
    <h1>JavaScript Quiz</h1>
    <div id="quiz-box">
      <p id="question-number">Question 1</p>
      <h2 id="question-text">Question text</h2>

      <div id="options" class="options"></div>

      <button id="next-btn" class="next-btn">Next Question</button>
    </div>

    <div id="result-box" class="result-box hidden">
      <h2>Quiz Finished!</h2>
      <p id="score-text"></p>
      <button id="restart-btn" class="restart-btn">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
